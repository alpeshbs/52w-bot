name: NSE 52W Tracker
on:
  schedule:
    - cron: '30 10 * * 1-5' # સોમવાર થી શુક્રવાર સાંજે ૪:૦૦ IST
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests pandas

      - name: Check Files & Run Bot
        run: |
          ls -la
          python main.py
